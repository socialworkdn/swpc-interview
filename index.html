    };

    // --- ฟังก์ชันจัดรูปแบบวันที่แบบปลอดภัย ---
    function formatDateSafe(dateStr) {
      if (!dateStr || dateStr === '') return 'ยังไม่ได้ระบุวันที่';
      const str = String(dateStr).trim();
      if (str.includes('วัน')) return str; 
      
      try {
        let year, month, day, dateObj;
        if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
          const parts = str.split('-');
          year = parseInt(parts[0]);
          month = parseInt(parts[1]) - 1;
          day = parseInt(parts[2]);
          dateObj = new Date(year, month, day); 
        } else {
          dateObj = new Date(str);
          if (isNaN(dateObj.getTime())) return str;
          year = dateObj.getFullYear();
          month = dateObj.getMonth();
          day = dateObj.getDate();
        }
        
        const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        const thaiDays = ["วันอาทิตย์", "วันจันทร์", "วันอังคาร", "วันพุธ", "วันพฤหัสบดี", "วันศุกร์", "วันเสาร์"];
        return `${thaiDays[dateObj.getDay()]}ที่ ${day} ${thaiMonths[month]} พ.ศ. ${year + 543}`;
      } catch (e) {
        return str;
      }
    }

    // --- ฟังก์ชันแปลงวันที่ไทยเป็นรูปแบบ ISO (YYYY-MM-DD) สำหรับ Date Picker ---
    function parseThaiDateToISO(dateStr) {
      if (!dateStr) return '';
      if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr;
      
      const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
      
      let year = -1;
      const yearMatch = String(dateStr).match(/\d{4}/);
      if (yearMatch) {
        year = parseInt(yearMatch[0]);
        if (year > 2500) year -= 543;
      }

      let day = -1;
      const dayMatch = String(dateStr).match(/(?:ที่\s*)?(\d{1,2})\s/); 
      if(dayMatch) {
          day = parseInt(dayMatch[1]);
      } else {
          const simpleDayMatch = String(dateStr).match(/\d{1,2}/);
          if (simpleDayMatch) day = parseInt(simpleDayMatch[0]);
      }

      let monthIndex = -1;
      for (let i = 0; i < thaiMonths.length; i++) {
        if (String(dateStr).includes(thaiMonths[i])) {
          monthIndex = i;
          break;
        }
      }

      if (year > 0 && monthIndex >= 0 && day > 0) {
        const mm = String(monthIndex + 1).padStart(2, '0');
        const dd = String(day).padStart(2, '0');
        return `${year}-${mm}-${dd}`;
      }

      return '';
    }

    function formatSessionId(id) {
      return `SWPC${String(id).padStart(3, '0')}`;
    }

    // --- Helper Definitions for Scoring ---
    const RANGES_30 = {
      excellent: { min: 21, max: 30, label: 'ดีมาก', c: 'green' },
      good: { min: 11, max: 20, label: 'ดี', c: 'amber' },
      fair: { min: 0, max: 10, label: 'พอใช้', c: 'red' }
    };

    const getLevelFromScore30 = (score) => {
      if (score === '' || score === null || score === undefined) return '';
      const num = Number(score);
      if (num >= 21 && num <= 30) return 'excellent';
      if (num >= 11 && num <= 20) return 'good';
      if (num >= 0 && num <= 10) return 'fair';
      return '';
    };

    const RANGES_20 = {
      excellent: { min: 16, max: 20, label: 'ดีมาก', c: 'green' },
      good: { min: 11, max: 15, label: 'ดี', c: 'amber' },
      fair: { min: 0, max: 10, label: 'พอใช้', c: 'red' }
    };

    const getLevelFromScore20 = (score) => {
      if (score === '' || score === null || score === undefined) return '';
      const num = Number(score);
      if (num >= 16 && num <= 20) return 'excellent';
      if (num >= 11 && num <= 15) return 'good';
      if (num >= 0 && num <= 10) return 'fair';
      return '';
    };

    // --- Helper: เรียก Google Apps Script JSON API ผ่าน fetch (แทน google.script.run) ---
    // ใช้ POST + Content-Type: text/plain เพื่อเลี่ยง CORS preflight (Apps Script ตอบ preflight ไม่ได้)
    // ฝั่งเซิร์ฟเวอร์จะ parse เนื้อหาเป็น JSON เองโดยไม่สนใจ header นี้
    async function callServer(fnName, ...args) {
      if (!API_BASE_URL || API_BASE_URL.indexOf('YOUR_DEPLOYMENT_ID') > -1) {
        return { success: false, message: 'ยังไม่ได้ตั้งค่า API_BASE_URL กรุณาใส่ URL ของ Apps Script Web App ในไฟล์ index.html' };
      }
      try {
        const res = await fetch(API_BASE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: fnName, params: args })
        });
        if (!res.ok) return { success: false, message: `เซิร์ฟเวอร์ตอบกลับผิดพลาด (HTTP ${res.status})` };
        return await res.json();
      } catch (err) {
        return { success: false, message: 'เชื่อมต่อ API ไม่สำเร็จ: ' + (err.message || err.toString()) };
      }
    }

    // ดึงข้อมูลรอบสอบทั้งหมด (อ่านอย่างเดียว, สาธารณะ) ผ่าน GET
    async function fetchInitialData() {
      if (!API_BASE_URL || API_BASE_URL.indexOf('YOUR_DEPLOYMENT_ID') > -1) {
        return { success: false, message: 'ยังไม่ได้ตั้งค่า API_BASE_URL กรุณาใส่ URL ของ Apps Script Web App ในไฟล์ index.html' };
      }
      try {
        const res = await fetch(`${API_BASE_URL}?action=getInitialData`, { method: 'GET' });
        if (!res.ok) return { success: false, message: `เซิร์ฟเวอร์ตอบกลับผิดพลาด (HTTP ${res.status})` };
        return await res.json();
      } catch (err) {
        return { success: false, message: 'เชื่อมต่อ API ไม่สำเร็จ: ' + (err.message || err.toString()) };
      }
    }

    // --- ยืนยัน + ตั้ง/ยกเลิกสถานะ "ไม่เข้าสอบ" (ใช้ร่วมกันระหว่างกรรมการและแอดมิน) ---
    // doCall(newAbsent) ต้องคืน Promise ของผลลัพธ์จาก server ({ success, candidate?, message? })
    // คืนค่า res เมื่อสำเร็จ, คืน null เมื่อผู้ใช้กดยกเลิก
    async function confirmToggleAbsent(candidate, newAbsent, doCall) {
      const fullName = `${candidate.title || ''}${candidate.name || ''}`;
      const hasScore = !!(candidate.scores && (candidate.scores.inv1 || candidate.scores.inv2));
      const html = newAbsent
        ? `ระบุว่า <b>${fullName}</b> ไม่เข้าสอบ<br/><span style="font-size:0.9em;color:#64748b">จะไม่ถูกนับเป็นผ่าน/ไม่ผ่าน และไม่สามารถให้คะแนนได้จนกว่าจะยกเลิกสถานะนี้` +
          (hasScore ? `<br/>คะแนนที่เคยบันทึกไว้จะไม่ถูกลบ และกลับมาใช้ได้เมื่อยกเลิกสถานะ` : '') + `</span>`
        : `ยกเลิกสถานะ "ไม่เข้าสอบ" ของ <b>${fullName}</b> ?<br/><span style="font-size:0.9em;color:#64748b">กลับไปอยู่ในสถานะรอประเมินตามปกติ</span>`;
      const result = await Swal.fire({
        icon: newAbsent ? 'warning' : 'question',
        title: newAbsent ? 'ยืนยัน "ไม่เข้าสอบ"?' : 'ยกเลิกสถานะไม่เข้าสอบ?',
        html,
        showCancelButton: true,
        confirmButtonText: newAbsent ? 'ยืนยัน ไม่เข้าสอบ' : 'ยกเลิกสถานะ',
        cancelButtonText: 'ปิด',
        confirmButtonColor: newAbsent ? '#e11d48' : '#2563eb',
        showLoaderOnConfirm: true,
        allowOutsideClick: () => !Swal.isLoading(),
        preConfirm: async () => {
          const res = await doCall(newAbsent);
          if (!res || !res.success) {
            Swal.showValidationMessage((res && res.message) || 'บันทึกสถานะไม่สำเร็จ');
            return false;
          }
          return res;
        }
      });
      return result.isConfirmed ? result.value : null;
    }

    function getSessionStats(candidates) {
      const total = candidates.length;
      let passed = 0;
      let failed = 0;
      let pending = 0;
      let absent = 0;

      candidates.forEach(c => {
         if (c.absent) { absent++; return; } // ไม่เข้าสอบ: ไม่นับเป็นผ่าน/ไม่ผ่าน/รอประเมิน
         const s1 = c.scores?.inv1?.total;
         const s2 = c.scores?.inv2?.total;
         if (s1 != null && s2 != null) {
            if ((Number(s1) + Number(s2)) / 2 >= 60) passed++;
            else failed++;
         } else {
            pending++;
         }
      });

      // เปอร์เซ็นต์คิดจาก "ผู้ที่เข้าสอบจริง" (ไม่รวมคนที่ไม่เข้าสอบ)
      const attended = total - absent;
      const passedPct = attended > 0 ? ((passed / attended) * 100).toFixed(1) : 0;
      const failedPct = attended > 0 ? ((failed / attended) * 100).toFixed(1) : 0;

      return { total, passed, failed, pending, absent, attended, passedPct, failedPct };
    }

    function App() {
      const [sessions, setSessions] = useState([]);
      const [currentUser, setCurrentUser] = useState(null);
      const [selectedCandidate, setSelectedCandidate] = useState(null);
      const [printData, setPrintData] = useState(null); 
      const [isFetching, setIsFetching] = useState(true);
      const [fetchError, setFetchError] = useState(null);
      const [isRefreshing, setIsRefreshing] = useState(false);

      const loadData = (silent = false) => {
        if (!silent) { setIsFetching(true); setFetchError(null); } else { setIsRefreshing(true); }

        fetchInitialData()
          .then((res) => {
            if (res.success) {
              setSessions(res.sessions || []);
              setFetchError(null);
            } else {
              console.error("Backend Error:", res.message);
              setFetchError(res.message || 'ไม่ทราบสาเหตุ');
            }
          })
          .catch((err) => {
            console.error("Error fetching data", err);
            setFetchError((err && err.message) || 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ');
          })
          .finally(() => {
            setIsFetching(false);
            setIsRefreshing(false);
          });
      };

      useEffect(() => { loadData(false); }, []);

      // รีเฟรชข้อมูลอัตโนมัติเงียบๆ ทุก 60 วินาที เพื่อให้เห็นข้อมูลล่าสุดระหว่างวันสอบ
      useEffect(() => {
        const timer = setInterval(() => { if (!isFetching) loadData(true); }, 60000);
        return () => clearInterval(timer);
      }, [isFetching]);

      const handleLogin = (userObj) => setCurrentUser(userObj);

      const handleLogout = () => {
        setCurrentUser(null);
        setSelectedCandidate(null);
        setPrintData(null);
      };

      const handleSaveScore = async (candidateId, scoreData, remark) => {
        const res = await callServer('interviewerSaveScore', currentUser.token, currentUser.sessionId, currentUser.groupId, candidateId, scoreData, remark);
        if (!res || !res.success) {
          if (res && /เซสชันหมดอายุ|ไม่ได้รับอนุญาต/.test(res.message || '')) {
            Swal.fire({ icon: 'warning', title: 'เซสชันหมดอายุ', text: 'กรุณาเข้าสู่ระบบใหม่อีกครั้ง' }).then(handleLogout);
          }
          throw new Error((res && res.message) || 'บันทึกไม่สำเร็จ');
        }
        const updatedCandidate = res.candidate || {
          id: candidateId,
          scores: { [currentUser.invSlot]: { ...scoreData, total: Number(scoreData.skill) + Number(scoreData.attitude) + Number(scoreData.writing) + Number(scoreData.presentation) } },
          remarks: { [currentUser.invSlot]: remark }
        };
        setSessions(prev => prev.map(s => {
          if (s.id !== currentUser.sessionId) return s;
          return { ...s, candidates: s.candidates.map(c => c.id === candidateId ? { ...c, ...updatedCandidate } : c) };
        }));
        setSelectedCandidate(null);
        return "บันทึกคะแนนและซิงค์ลง Sheet สำเร็จ";
      };

      const handleToggleAbsent = async (candidate, newAbsent) => {
        const res = await confirmToggleAbsent(candidate, newAbsent, (a) =>
          callServer('setCandidateAbsent', currentUser.token, currentUser.sessionId, currentUser.groupId, candidate.id, a));
        if (!res) return;
        const updated = res.candidate || { ...candidate, absent: newAbsent };
        setSessions(prev => prev.map(s => s.id !== currentUser.sessionId ? s : { ...s, candidates: s.candidates.map(c => c.id === candidate.id ? { ...c, ...updated } : c) }));
        Swal.fire({ icon: 'success', title: newAbsent ? 'บันทึก "ไม่เข้าสอบ" แล้ว' : 'ยกเลิกสถานะแล้ว', timer: 1400, showConfirmButton: false });
      };

      if (isFetching) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center bg-slate-900 text-white">
            <div className="loader mb-4 !border-t-blue-400 !w-12 !h-12 !border-4"></div>
            <h2 className="text-xl font-bold font-sans">กำลังเชื่อมต่อฐานข้อมูล...</h2>
            <p className="text-slate-400 text-sm mt-2 font-sans">กรุณารอสักครู่ ระบบกำลังดึงข้อมูลล่าสุด</p>
          </div>
        );
      }

      if (fetchError) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center bg-slate-900 text-white p-6 text-center">
            <div className="w-16 h-16 bg-red-500/20 text-red-400 rounded-full flex items-center justify-center mb-4"><Icons.XBadge className="w-8 h-8" /></div>
            <h2 className="text-xl font-bold font-sans">ดึงข้อมูลไม่สำเร็จ</h2>
            <p className="text-slate-400 text-sm mt-2 font-sans max-w-md">{fetchError}</p>
            <button onClick={() => loadData(false)} className="mt-6 bg-blue-600 hover:bg-blue-700 px-5 py-2.5 rounded-lg font-medium text-sm transition-colors">ลองใหม่อีกครั้ง</button>
          </div>
        );
      }

      if (printData) return <PrintableScoreSheet data={printData} onClose={() => setPrintData(null)} />;
      if (!currentUser) return <LoginScreen onLogin={handleLogin} sessions={sessions} />;

      if (currentUser.role === 'admin') {
         return (
            <div className="min-h-screen flex flex-col bg-slate-50">
              <NavBar user={currentUser} onLogout={handleLogout} onRefresh={() => loadData(true)} isRefreshing={isRefreshing} />
              <div className="max-w-6xl w-full mx-auto p-4 sm:p-6 flex-grow">
                <AdminController sessions={sessions} setSessions={setSessions} onPrint={setPrintData} token={currentUser.token} reload={() => loadData(true)} />
              </div>
              <AppFooter />
            </div>
         );
      }

      const activeSession = sessions.find(s => s.id === currentUser.sessionId);
      if (!activeSession) {
        return (
          <div className="p-8 text-center">
            ไม่พบรอบสอบ กรุณาเข้าสู่ระบบใหม่ 
            <button onClick={handleLogout} className="text-blue-500 underline ml-2">ออก</button>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          <NavBar user={currentUser} onLogout={handleLogout} onRefresh={() => loadData(true)} isRefreshing={isRefreshing} />
          <div className="max-w-6xl w-full mx-auto p-4 sm:p-6 flex-grow">
            {selectedCandidate ? (
              <ScoringForm 
                candidate={selectedCandidate} user={currentUser} 
                onSave={handleSaveScore} onCancel={() => setSelectedCandidate(null)} 
              />
            ) : (
              <InterviewerDashboard 
                session={activeSession}
                candidates={activeSession.candidates.filter(c => c.groupId === currentUser.groupId)} 
                user={currentUser} examInfo={activeSession.examInfo}
                onSelectCandidate={setSelectedCandidate} onPrint={setPrintData}
                onToggleAbsent={handleToggleAbsent}
              />
            )}
          </div>
          <AppFooter />
        </div>
      );
    }

        <footer className={`py-6 text-center text-sm print-hide ${dark ? 'text-slate-400 bg-slate-900' : 'text-slate-500 bg-white border-t border-slate-200'} mt-auto`}>
          <div className="max-w-6xl mx-auto px-4">

          </div>

    function LoginScreen({ onLogin, sessions }) {
      const activeSessions = sessions.filter(s => s.isOpen !== false);
      const [selectedSessionId, setSelectedSessionId] = useState('');
      const [selectedGroup, setSelectedGroup] = useState('');
      const [loadingSlot, setLoadingSlot] = useState('');

      const [showAdminLogin, setShowAdminLogin] = useState(false);
      const [adminPassword, setAdminPassword] = useState('');
      const [isAdminSubmitting, setIsAdminSubmitting] = useState(false);

      const handleAdminSubmit = async (e) => {
        e.preventDefault();
        setIsAdminSubmitting(true);
        try {
          const res = await callServer('verifyAdminLogin', adminPassword);
          if (res && res.success) {
            onLogin({ role: 'admin', name: 'เจ้าหน้าที่ส่วนกลาง (Admin)', token: res.token });

            Swal.fire({
              icon: 'error',
              title: 'เข้าสู่ระบบล้มเหลว',
              text: (res && res.message) || 'รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง',
              confirmButtonColor: '#3085d6'
            });
            setAdminPassword('');
          }
        } catch (err) {
          Swal.fire({ icon: 'error', title: 'เชื่อมต่อไม่สำเร็จ', text: err.message, confirmButtonColor: '#3085d6' });
        } finally {
          setIsAdminSubmitting(false);
        }
      };

      useEffect(() => {
        if (activeSessions.length > 0 && !activeSessions.find(s => s.id === selectedSessionId)) {
          setSelectedSessionId(activeSessions[0].id);
        }
      }, [activeSessions, selectedSessionId]);

      const activeSession = activeSessions.find(s => s.id === selectedSessionId) || activeSessions[0];
      const interviewers = activeSession?.interviewers || {};

      useEffect(() => {
        const groups = Object.keys(interviewers);
        if (groups.length > 0) { setSelectedGroup(groups[0]); } 
        else { setSelectedGroup(''); }
      }, [selectedSessionId, interviewers]);

      // --- เข้าสู่ระบบกรรมการ: ตรวจรหัสผ่านที่ฝั่งเซิร์ฟเวอร์เสมอ ---
      const doInterviewerLogin = async (slot, password) => {
        setLoadingSlot(slot);
        try {
          const res = await callServer('verifyInterviewerLogin', selectedSessionId, selectedGroup, slot, password || '');
          if (res && res.success) {
            onLogin({ role: 'interviewer', name: res.name, groupId: Number(selectedGroup), invSlot: slot, sessionId: selectedSessionId, token: res.token });
            return true;
          }
          Swal.fire({ icon: 'error', title: 'เข้าสู่ระบบไม่สำเร็จ', text: (res && res.message) || 'เกิดข้อผิดพลาด', confirmButtonColor: '#3085d6' });
          return false;
        } catch (err) {
          Swal.fire({ icon: 'error', title: 'เชื่อมต่อไม่สำเร็จ', text: err.message, confirmButtonColor: '#3085d6' });
          return false;
        } finally {
          setLoadingSlot('');
        }
      };

      const handleInterviewerLoginClick = (slot) => {
        const groupData = interviewers[selectedGroup];
        if (groupData && groupData.hasPassword) {
          Swal.fire({
            title: `เข้าสู่ระบบ ${slot === 'inv1' ? 'กรรมการ 1' : 'กรรมการ 2'}`,
            input: 'password',
            inputLabel: `กรุณากรอกรหัสผ่านของกลุ่มที่ ${selectedGroup}`,
            inputPlaceholder: 'รหัสผ่าน',
            showCancelButton: true,
            confirmButtonText: 'เข้าสู่ระบบ',
            cancelButtonText: 'ยกเลิก',
            confirmButtonColor: '#2563eb',
            showLoaderOnConfirm: true,
            preConfirm: async (value) => {
              if (!value) { Swal.showValidationMessage('กรุณากรอกรหัสผ่าน!'); return false; }
              const ok = await doInterviewerLogin(slot, value);
              if (!ok) { Swal.showValidationMessage('รหัสผ่านไม่ถูกต้อง หรือเกิดข้อผิดพลาด'); return false; }
              return true;
            }
          });
        } else {
          doInterviewerLogin(slot, '');
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-900">
          <div className="flex-grow flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 text-center">
              <img src="https://img2.pic.in.th/New-Logo-2564.jpg" alt="โลโก้" className="w-24 h-auto mx-auto mb-4 object-contain" />
              <h1 className="text-2xl font-bold text-slate-800 mb-2">ระบบให้คะแนนสอบสัมภาษณ์</h1>
              <p className="text-sm text-slate-500 mb-6">สภาวิชาชีพสังคมสงเคราะห์</p>

              {showAdminLogin ? (
                <form onSubmit={handleAdminSubmit} className="text-left bg-slate-50 p-5 rounded-xl border border-slate-200 mb-6 shadow-inner">
                  <label className="block text-sm font-bold text-slate-800 mb-3 border-b border-slate-200 pb-2">เข้าสู่ระบบส่วนกลาง</label>
                  <input
                    type="password"
                    placeholder="กรอกรหัสผ่าน Admin"
                    value={adminPassword}
                    onChange={(e) => setAdminPassword(e.target.value)}
                    className="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500 bg-white mb-1 text-sm"
                    autoFocus
                  />
                  <div className="flex gap-2 mt-4">
                    <button type="button" onClick={() => { setShowAdminLogin(false); setAdminPassword(''); }} className="flex-1 py-2.5 px-4 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 rounded-lg text-sm font-medium transition-colors">
                      ยกเลิก
                    </button>
                    <button type="submit" disabled={isAdminSubmitting} className="flex-1 py-2.5 px-4 bg-slate-800 hover:bg-slate-900 disabled:opacity-60 text-white rounded-lg text-sm font-medium transition-colors shadow-sm flex items-center justify-center gap-2">
                      {isAdminSubmitting ? <span className="loader !w-4 !h-4 !border-2"></span> : 'เข้าสู่ระบบ'}
                    </button>
                  </div>
                </form>
              ) : (
                <button onClick={() => setShowAdminLogin(true)} className="w-full py-3 px-4 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-sm font-medium transition-colors mb-6 shadow-sm">
                  เข้าสู่ระบบ: เจ้าหน้าที่ส่วนกลาง (Admin)
                </button>
              )}
              
              <div className="text-left bg-slate-50 p-5 rounded-xl border border-slate-200">
                <label className="block text-sm font-bold text-slate-800 mb-2 border-b border-slate-200 pb-2">สำหรับกรรมการสอบ</label>
                
                {activeSessions.length > 0 ? (
                  <>
                    <label className="block text-xs font-semibold text-slate-500 mb-1 mt-3">1. เลือกรอบสอบ</label>
                    <select 
                      value={selectedSessionId} 
                      onChange={(e) => setSelectedSessionId(Number(e.target.value))}
                      className="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500 bg-white mb-4 text-sm font-medium text-slate-700"
                    >
                      {activeSessions.map(s => {
                        const dateStr = formatDateSafe(s.examInfo.date);
                        return (
                          <option key={s.id} value={s.id}>
                            ครั้งที่ {s.examInfo.round}/{s.examInfo.year} - {dateStr}
                          </option>
                        );
                      })}
                    </select>

                    {selectedGroup !== '' ? (
                      <>
                        <label className="block text-xs font-semibold text-slate-500 mb-1">2. เลือกกลุ่มสอบ</label>
                        <select 
                          value={selectedGroup} 
                          onChange={(e) => setSelectedGroup(e.target.value)}
                          className="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500 bg-white mb-4 text-sm"
                        >
                          {Object.keys(interviewers).map(k => (
                            <option key={k} value={k}>กลุ่มที่ {k}</option>
                          ))}
                        </select>

                        <label className="block text-xs font-semibold text-slate-500 mb-1">3. เข้าสู่ระบบในฐานะ</label>
                        <div className="grid grid-cols-1 gap-2">
                          <button onClick={() => handleInterviewerLoginClick('inv1')} disabled={loadingSlot !== ''} className="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white rounded-lg text-sm font-medium transition-colors text-left flex items-center shadow-sm relative">
                            <span className="w-20 opacity-80">กรรมการ 1</span> 
                            <span className="flex-1 truncate">{interviewers[selectedGroup]?.inv1 || 'ยังไม่ระบุชื่อ'}</span>
                            {loadingSlot === 'inv1' ? <span className="loader !w-4 !h-4 !border-2 !border-t-white"></span> : (interviewers[selectedGroup]?.hasPassword && <Icons.Lock className="w-4 h-4 opacity-50 absolute right-4" />)}
                          </button>
                          <button onClick={() => handleInterviewerLoginClick('inv2')} disabled={loadingSlot !== ''} className="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white rounded-lg text-sm font-medium transition-colors text-left flex items-center shadow-sm relative">
                            <span className="w-20 opacity-80">กรรมการ 2</span> 
                            <span className="flex-1 truncate">{interviewers[selectedGroup]?.inv2 || 'ยังไม่ระบุชื่อ'}</span>
                            {loadingSlot === 'inv2' ? <span className="loader !w-4 !h-4 !border-2 !border-t-white"></span> : (interviewers[selectedGroup]?.hasPassword && <Icons.Lock className="w-4 h-4 opacity-50 absolute right-4" />)}
                          </button>
                        </div>
                      </>
                    ) : (
                      <p className="text-sm text-red-500 text-center py-4 bg-red-50 rounded-lg">รอบสอบนี้ยังไม่ได้ตั้งค่ากลุ่มสอบ</p>
                    )}
                  </>
                ) : (
                  <div className="text-center py-6">
                     <div className="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-3 text-slate-400">
                       <Icons.EyeOff className="w-6 h-6" />
                     </div>
                     <p className="text-sm font-bold text-slate-600">ไม่มีรอบสอบที่เปิดให้ประเมิน</p>
                     <p className="text-xs text-slate-400 mt-1">ส่วนกลางได้ปิดรับคะแนนรอบสอบทั้งหมดแล้ว</p>
                  </div>
                )}
              </div>
            </div>
          </div>
          <AppFooter dark={true} />
        </div>
      );
    }

    function NavBar({ user, onLogout, onRefresh, isRefreshing }) {
      return (
        <nav className="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-10 print-hide">
          <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <img src="https://img2.pic.in.th/New-Logo-2564.jpg" alt="โลโก้" className="h-10 w-auto object-contain" />
              <span className="font-bold text-slate-800 hidden sm:inline">ระบบสอบสัมภาษณ์</span>

            <div className="flex items-center gap-3">

                <button onClick={onRefresh} disabled={isRefreshing} className="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors disabled:opacity-50" title="รีเฟรชข้อมูลล่าสุด">
                  <svg className={`w-5 h-5 ${isRefreshing ? 'animate-spin' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>

              </button>
            </div>
          </div>
        </nav>
      );
    }

    // --- ADMIN CONTROLLER ---
    function AdminController({ sessions, setSessions, onPrint, token, reload }) {
      const [view, setView] = useState('list'); 
      const [adminActiveSessionId, setAdminActiveSessionId] = useState(null);
      const [isCreating, setIsCreating] = useState(false);

      const handleCreateSession = async () => {
        const newId = sessions.length > 0 ? Math.max(...sessions.map(s => s.id)) + 1 : 1;
        setIsCreating(true);
        try {
          const res = await callServer('createSessionSheet', token, newId);
          if (!res || !res.success) {
            Swal.fire({ icon: 'error', title: 'สร้างไม่สำเร็จ', text: (res && res.message) || 'เกิดข้อผิดพลาด', confirmButtonColor: '#3085d6' });
            return;
          }
          const newSession = { 
            id: newId, 
            isOpen: true,
            examInfo: { round: '1', year: new Date().getFullYear() + 543, date: '', time: '09.30 - 14.30 น.' }, 
            interviewers: { 1: { inv1: '', inv2: '', hasPassword: false } }, 
            candidates: [] 
          };
          setSessions([...sessions, newSession]);
        } catch (err) {
          Swal.fire({ icon: 'error', title: 'เชื่อมต่อไม่สำเร็จ', text: err.message, confirmButtonColor: '#3085d6' });
        } finally {
          setIsCreating(false);
        }
      };

      const handleDeleteSession = (id) => {
        Swal.fire({
          title: 'ยืนยันการลบรอบสอบ?',
          text: `คุณต้องการลบรอบสอบ ${formatSessionId(id)} ใช่หรือไม่? ข้อมูลทั้งหมดในรอบนี้จะสูญหายถาวรและกู้คืนไม่ได้`,
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#d33',
          cancelButtonColor: '#3085d6',
          confirmButtonText: 'ลบข้อมูล',
          cancelButtonText: 'ยกเลิก',
          showLoaderOnConfirm: true,
          preConfirm: async () => {
            const res = await callServer('deleteSessionSheet', token, id);
            if (!res || !res.success) { Swal.showValidationMessage((res && res.message) || 'ลบไม่สำเร็จ'); return false; }
            return true;
          }
        }).then((result) => {
          if (result.isConfirmed) {
            setSessions(sessions.filter(s => s.id !== id));
            Swal.fire({ icon: 'success', title: 'ลบสำเร็จ', text: 'รอบสอบถูกลบออกจากระบบแล้ว', timer: 1500, showConfirmButton: false });
          }
        });
      };

      const handleToggleOpen = async (id) => {
        const sessionToToggle = sessions.find(s => s.id === id);
        const newStatus = sessionToToggle.isOpen === false ? true : false;
        setSessions(prev => prev.map(s => s.id === id ? { ...s, isOpen: newStatus } : s));
        const res = await callServer('toggleSessionStatus', token, id, newStatus);
        if (!res || !res.success) {
          setSessions(prev => prev.map(s => s.id === id ? { ...s, isOpen: !newStatus } : s));
          Swal.fire({ icon: 'error', title: 'บันทึกไม่สำเร็จ', text: (res && res.message) || 'เกิดข้อผิดพลาด กรุณาลองใหม่', confirmButtonColor: '#3085d6' });
        }
      };

      if (view === 'list') {
        const allStats = sessions.reduce((acc, session) => {
          const stats = getSessionStats(session.candidates);
          acc.total += stats.total;
          acc.passed += stats.passed;
          acc.failed += stats.failed;
          acc.pending += stats.pending;
          acc.absent += stats.absent;
          return acc;
        }, { total: 0, passed: 0, failed: 0, pending: 0, absent: 0 });

        const allAttended = allStats.total - allStats.absent;
        allStats.passedPct = allAttended > 0 ? ((allStats.passed / allAttended) * 100).toFixed(1) : 0;
        allStats.failedPct = allAttended > 0 ? ((allStats.failed / allAttended) * 100).toFixed(1) : 0;

        return (
          <div className="space-y-6 mt-2">
            <div className="flex justify-between items-center">
              <h2 className="text-2xl font-bold text-slate-800">รายการรอบสอบทั้งหมด</h2>
              <button onClick={handleCreateSession} disabled={isCreating} className="bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white px-4 py-2.5 rounded-lg font-medium shadow-sm flex items-center gap-2 transition-colors">
                <Icons.Plus /> สร้างรอบการสอบใหม่
              </button>
            </div>
            
            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-2">
              <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                  <p className="text-xs text-slate-500 font-bold mb-1">ผู้เข้าสอบทั้งหมด (สะสม)</p>
                  <h3 className="text-2xl font-black text-slate-800">{allStats.total} <span className="text-sm font-normal text-slate-500">คน</span></h3>
                  {allStats.absent > 0 && <p className="text-xs text-slate-400 mt-0.5">ไม่เข้าสอบ {allStats.absent} คน</p>}
                </div>
                <div className="p-3 bg-blue-50 text-blue-600 rounded-full"><Icons.Users className="w-6 h-6"/></div>
              </div>
              <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                  <p className="text-xs text-green-600 font-bold mb-1">สอบผ่านสะสม</p>
                  <h3 className="text-2xl font-black text-green-700">{allStats.passed} <span className="text-sm font-normal text-green-600/70">({allStats.passedPct}%)</span></h3>
                </div>
                <div className="p-3 bg-green-50 text-green-600 rounded-full"><Icons.CheckBadge className="w-6 h-6"/></div>
              </div>
              <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                  <p className="text-xs text-red-500 font-bold mb-1">สอบไม่ผ่านสะสม</p>
                  <h3 className="text-2xl font-black text-red-600">{allStats.failed} <span className="text-sm font-normal text-red-500/70">({allStats.failedPct}%)</span></h3>
                </div>
                <div className="p-3 bg-red-50 text-red-500 rounded-full"><Icons.XBadge className="w-6 h-6"/></div>
              </div>
              <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                  <p className="text-xs text-amber-500 font-bold mb-1">รอประเมิน / ไม่ครบ</p>
                  <h3 className="text-2xl font-black text-amber-600">{allStats.pending} <span className="text-sm font-normal text-amber-500/70">คน</span></h3>
                </div>
                <div className="p-3 bg-amber-50 text-amber-500 rounded-full"><Icons.Clock className="w-6 h-6"/></div>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {sessions.map(s => {
                const stats = getSessionStats(s.candidates);
                const isOpen = s.isOpen !== false;

                return (
                  <div key={s.id} className={`bg-white rounded-xl shadow-sm border p-5 hover:shadow-md transition-shadow relative ${isOpen ? 'border-blue-200' : 'border-slate-200 opacity-90'}`}>
                    <div className="flex justify-between items-start mb-4">
                      <div>
                        <div className="text-lg font-extrabold text-slate-800">ลำดับที่ {formatSessionId(s.id)}</div>
                        <div className="text-xs font-bold text-blue-700 bg-blue-50 px-2 py-1 rounded-md inline-block mt-1">
                          ครั้งที่ {s.examInfo.round}/{s.examInfo.year}
                        </div>
                      </div>
                      <div className="flex items-center gap-1">
                        <button onClick={() => handleToggleOpen(s.id)} className={`px-2.5 py-1 text-xs font-bold rounded-full border flex items-center gap-1 transition-colors ${isOpen ? 'bg-green-50 text-green-700 border-green-200 hover:bg-green-100' : 'bg-slate-100 text-slate-500 border-slate-200 hover:bg-slate-200'}`}>
                          {isOpen ? <><span className="w-1.5 h-1.5 rounded-full bg-green-500 inline-block"></span> เปิดรับคะแนน</> : <><Icons.EyeOff className="w-3 h-3" /> ปิดแล้ว</>}
                        </button>
                        <button onClick={() => handleDeleteSession(s.id)} className="text-slate-300 hover:text-red-500 p-1.5 hover:bg-red-50 rounded-lg transition-colors" title="ลบรอบสอบนี้">
                          <Icons.Trash />
                        </button>
                      </div>
                    </div>
                    
                    <div className="space-y-2.5 text-sm text-slate-600 mb-4 bg-slate-50 p-3 rounded-lg border border-slate-100">
                      <div className="flex items-center gap-2"><Icons.Clock /> <span className="font-medium">วันที่:</span> {formatDateSafe(s.examInfo.date)}</div>
                      <div className="flex items-center gap-2"><Icons.Settings /> <span className="font-medium">กลุ่มสอบ:</span> {Object.keys(s.interviewers).length} กลุ่ม</div>
                    </div>

                    <div className="grid grid-cols-3 gap-2 mb-5">
                      <div className="bg-slate-50 p-2 rounded-lg text-center border border-slate-100">
                        <div className="text-[11px] text-slate-500 mb-0.5 font-bold">ทั้งหมด</div>
                        <div className="text-base font-bold text-slate-700">{stats.total} <span className="text-[10px] font-normal text-slate-400">คน</span></div>
                        {stats.absent > 0 && <div className="text-[10px] text-slate-400">ไม่เข้าสอบ {stats.absent}</div>}
                      </div>
                      <div className="bg-green-50 p-2 rounded-lg text-center border border-green-100">
                        <div className="text-[11px] text-green-600 mb-0.5 font-bold">ผ่าน</div>
                        <div className="text-base font-bold text-green-700">{stats.passed} <span className="text-[10px] font-normal opacity-70">({stats.passedPct}%)</span></div>
                      </div>
                      <div className="bg-red-50 p-2 rounded-lg text-center border border-red-100">
                        <div className="text-[11px] text-red-600 mb-0.5 font-bold">ไม่ผ่าน</div>
                        <div className="text-base font-bold text-red-700">{stats.failed} <span className="text-[10px] font-normal opacity-70">({stats.failedPct}%)</span></div>
                      </div>
                    </div>
                    
                    <div className="grid grid-cols-2 gap-3">
                      <button onClick={() => { setAdminActiveSessionId(s.id); setView('manage'); }} className="bg-slate-100 text-slate-700 py-2.5 rounded-lg hover:bg-slate-200 text-sm font-bold flex items-center justify-center gap-1.5 transition-colors shadow-sm">
                        <Icons.Settings /> จัดการข้อมูล
                      </button>
                      <button onClick={() => { setAdminActiveSessionId(s.id); setView('results'); }} className="bg-emerald-50 text-emerald-700 py-2.5 rounded-lg hover:bg-emerald-100 text-sm font-bold flex items-center justify-center gap-1.5 transition-colors shadow-sm">
                        <Icons.FileText /> สรุปผล
                      </button>
                    </div>
                  </div>
                );
              })}
              {sessions.length === 0 && (
                <div className="col-span-full text-center py-16 bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl text-slate-500 flex flex-col items-center">
                  <div className="w-16 h-16 bg-white rounded-full flex items-center justify-center mb-4 shadow-sm border border-slate-100"><Icons.FileText className="w-8 h-8"/></div>
                  ยังไม่มีรอบสอบในระบบ กรุณาสร้างรอบการสอบใหม่
                </div>
              )}
